<style>
@font-face{
 font-family:Jameel;
 src:url('https://cdn.jsdelivr.net/gh/tariq-abdullah/urdu-web-font-CDN/JameelNooriNastaleeq.woff') format('woff');
}
*{box-sizing:border-box}
body{margin:0;background:#edf4fb;color:#24334a;font-family:Arial,sans-serif}
header{background:linear-gradient(120deg,#063b75,#0796a8);color:white;text-align:center;padding:24px 10px}
header h1{font-size:30px;margin:0}
header p{margin:5px}
nav{background:white;padding:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px #0001}
button{border:0;border-radius:8px;background:#087eaa;color:white;padding:10px 14px;font-size:15px;cursor:pointer}
button:hover{background:#075985}
main{max-width:950px;margin:auto;padding:12px}
.card{background:white;border-radius:14px;padding:17px;margin:13px 0;box-shadow:0 2px 10px #0001}
.cover{background:linear-gradient(135deg,#075985,#13a6a5);color:white;text-align:center;border-radius:12px;padding:30px 12px}
.cover h2{color:white;font-size:30px}
.ur{font-family:Jameel,serif;direction:rtl;text-align:right;line-height:2.15;font-size:20px}
h2,h3{color:#075985}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.subject{background:#e5f4ff;border:1px solid #c5e2f7;padding:18px 8px;text-align:center;border-radius:12px;cursor:pointer}
.subject b{display:block;color:#075985;margin-bottom:8px}
.subject span{font-family:Jameel;font-size:20px}
.lesson{border-bottom:1px solid #ddd;padding:13px 0}
.lesson button{margin-top:8px}
.picture{width:100%;max-height:300px;object-fit:cover;border-radius:12px;background:#e7f2fa}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{background:#e8f5ff;border-radius:20px;padding:7px 12px}
.activity{background:#fff7dd;border-left:5px solid #edb93e;padding:12px;border-radius:8px}
.exercise{background:#f1f8ff;padding:12px;border-radius:8px;margin:10px 0}
.quizq{padding:12px;background:#f3f7fb;border-radius:9px;margin:10px 0}
.quizq label{display:block;padding:5px}
#qr{display:flex;justify-content:center;margin:15px}
.small{color:#64748b;font-size:13px}
footer{text-align:center;padding:22px;color:#64748b}
@media print{
 nav,.noprint,button{display:none!important}
 body{background:white}
 main{max-width:none;padding:0}
 .card{box-shadow:none;border:0}
 .newpage{break-before:page}
 img{max-height:220px}
}
</style>

/* تصویر کے لیے موضوع سے متعلق سرچ تصویر */
function pictureURL(title){
 return "https://loremflickr.com/900/500/"+encodeURIComponent(title)+ "?lock="+encodeURIComponent(title);
}
function home(){
 document.getElementById("app").innerHTML=`
 <section class="card">
 <div class="cover">
 <h2>Playgroup Books</h2>
 <h3 style="color:white">The Risen High School</h3>
 <p>سات مضامین کی تعلیمی کتابیں</p>
 <p>مصنف: ${A}</p><p>Author: ${E}</p>
 </div>
 <h2 class="ur">پلے گروپ کی کتابیں</h2>
 <p class="ur">اپنی پسند کا مضمون منتخب کریں۔ ہر کتاب میں بارہ اسباق شامل ہیں۔</p>
 <div class="grid">
 ${books.map(b=>`<div class="subject" onclick="openBook('${b.id}')">
 <b>${b.en}</b><span>${b.ur}</span><p>12 Lessons</p>
 </div>`).join("")}
 </div>
 </section>
 <section class="card">
 <h2 class="ur">کتابوں کا طریقۂ استعمال</h2>
 <p class="ur">ہر سبق کو ترتیب سے پڑھیں۔ تصویر دیکھیں، الفاظ دہرائیں، سرگرمی کریں اور آخر میں مشق اور سوالات حل کریں۔ استاد بچوں کی رہنمائی کریں۔</p>
 </section>`;
}
function openBook(id){
 const b=books.find(x=>x.id===id);
 document.getElementById("app").innerHTML=`
 <section class="card">
 <div class="cover">
 <h2>${b.en}</h2><h2>${b.ur}</h2>
 <p>PLAYGROUP</p><p>The Risen High School</p>
 <p>مصنف: ${A}</p><p>Author: ${E}</p>
 </div>
 <h2 class="ur">فہرستِ اسباق</h2>
 ${b.lessons.map((l,i)=>`<div class="lesson">
 <b>${i+1}. ${l[0]}</b><br>
 <button onclick="openLesson('${id}',${i})">سبق کھولیں / Open Lesson</button>
 </div>`).join("")}
 <button onclick="home()">واپس</button>
 <button onclick="window.print()">Print Book</button>
 </section>`;
}
function openLesson(id,n){
 const b=books.find(x=>x.id===id),l=b.lessons[n];
 const url=location.href.split("#")[0]+"#lesson="+id+"-"+n;
 const isUr=["urdu","islamiat"].includes(id);
 const explain=isUr?`<p class="ur">${l[1]}</p>`:`<p>${l[1]}</p>`;
 const words=l[2].split(",").map(w=>`<span class="word">${w.trim()}</span>`).join("");
 const activity=isUr?`<p class="ur">${l[3]}</p>`:`<p>${l[3]}</p>`;
 const question1=isUr?`<p class="ur">${l[4]}</p>`:`<p>${l[4]}</p>`;
 const question2=isUr?`<p class="ur">${l[5]}</p>`:`<p>${l[5]}</p>`;
 const quiz=[
 {q:l[4],a:[l[5],l[0],"مجھے معلوم نہیں"],correct:0},
 {q:"اس سبق کا موضوع کیا ہے؟",a:[l[0],"کھیل کا وقت","چھٹی"],correct:0},
 {q:"سبق میں کیا کرنا چاہیے؟",a:["توجہ سے سیکھنا","سبق نظر انداز کرنا","شور کرنا"],correct:0}
 ];
 window.activeQuiz=quiz;
 document.getElementById("app").innerHTML=`
 <article class="card">
 <div class="cover">
 <h2>${b.en}</h2><h2>${l[0]}</h2>
 <p>Playgroup | Lesson ${n+1} of 12</p>
 <p>مصنف: ${A}</p><p>Author: ${E}</p>
 </div>
 <h2 class="ur">سبق ${n+1}: ${l[0]}</h2>
 <img class="picture" src="${pictureURL(l[0])}" alt="${l[0]}" loading="lazy"
 onerror="this.style.display='none'">
 <h3 class="ur">سبق کی وضاحت / Lesson Explanation</h3>
 ${explain}
 <h3 class="ur">نئے الفاظ / New Words</h3>
 <div class="words">${words}</div>
 <h3 class="ur">سرگرمی / Activity</h3>
 <div class="activity">${activity}</div>
 <h3 class="ur">مشق / Exercise</h3>
 <div class="exercise">
 <p>1. ${question1}</p>
 <p>2. ${question2}</p>
 <p>3. ${isUr?"سبق کے اہم الفاظ استاد کے ساتھ دہرائیں۔":"Repeat the important words with your teacher."}</p>
 <p>4. ${isUr?"تصویر دیکھیں اور اس کے بارے میں بتائیں۔":"Look at the picture and talk about it."}</p>
 </div>
 <h3>Multiple Choice Questions (MCQs)</h3>
 ${quiz.map((q,i)=>`<div class="quizq">
 <b>${i+1}. ${q.q}</b>
 ${q.a.map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${a}</label>`).join("")}
 </div>`).join("")}
 <button onclick="checkQuiz()">Check Answers</button>
 <p id="result"></p>
 <h3 class="ur">سبق کا QR Code</h3>
 <p class="ur">QR کوڈ اسکین کرنے سے یہی سبق دوبارہ کھلے گا۔</p>
 <div id="qr"></div>
 <p class="small">QR link: ${url}</p>
 <div class="noprint">
 <button onclick="openLesson('${id}',${Math.max(0,n-1)})">Previous</button>
 <button onclick="openLesson('${id}',${Math.min(11,n+1)})">Next</button>
 <button onclick="openBook('${id}')">Book Index</button>
 <button onclick="window.print()">Print Lesson</button>
 </div>
 <p class="small">Page ${n+1} | The Risen High School | ${E}</p>
 </article>`;
 if(typeof QRCode!=="undefined"){
 new QRCode(document.getElementById("qr"),{text:url,width:170,height:170});
 }else{
 document.getElementById("qr").innerText="QR code requires internet connection.";
 }
}
function checkQuiz(){
 let score=0;
 window.activeQuiz.forEach((q,i)=>{
 const v=document.querySelector('input[name="q'+i+'"]:checked');
 if(v && Number(v.value)===q.correct)score++;
 });
 document.getElementById("result").innerText=
 "Correct answers: "+score+" / "+window.activeQuiz.length;
}
function routeQR(){
 if(!location.hash.startsWith("#lesson="))return;
 const key=decodeURIComponent(location.hash.slice(8));
 const [id,n]=key.split("-");
 if(books.some(b=>b.id===id)&&Number(n)>=0&&Number(n)<12){
 openLesson(id,Number(n));
 }
}
home();
window.addEventListener("hashchange",routeQR);
routeQR();
</script>
</body>
</html>
